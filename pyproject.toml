[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd-crib"
version = "0.1.0"
description = "Look up commands from your own Markdown cheatsheet notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
crib = "cmd_crib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
